<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="TicTacToe.js" defer></script>
</head>
<body>

   <div class="player_container">
        <div class="player" data-player-index="0">
            <p class="player-name"></p>
            <p class="player-cash"></p>
        </div>

        <div class="player" data-player-index="1">
            <p class="player-name"></p>
            <p class="player-cash"></p>
        </div>
    </div>
    <div class="board_container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
        <div>Item 9</div>
    </div>
    <button class="startgame_container">
        Start Game?
    </button>
</body>
</html>
